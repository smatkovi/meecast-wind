# Ereignistyp fuer die Vorhersage in der Ereignisansicht.
#
# Gehoert nach /usr/share/meegotouch/notifications/eventtypes/.
#
# Eine Falle, die man dieser Datei nicht ansieht: der Leser des
# Ereignistyps trennt jede Zeile am ersten Gleichheitszeichen -- auch eine
# Kommentarzeile. Steht in einem Kommentar eines, wird daraus ein
# Schluessel, und der steht nachher im Benachrichtigungsspeicher. Deshalb
# kommt in den Kommentaren hier keines vor.
#
# Kein class system: das waere ein Banner ueber allem, auch am
# Sperrbildschirm -- fuer eine Wettervorhersage genau falsch, sie ist
# Auskunft und keine Meldung. Ohne class steht sie ruhig in der Liste der
# Ereignisansicht, und dort soll sie ja stehen.
#
# Kein feedbackId: ein Ton bei jeder Wetteraktualisierung waere eine Plage.
#
# userRemovable, damit man sie wegwischen kann; persistent, damit sie einen
# Neustart ueberlebt -- sonst stuende die Ereignisansicht nach jedem Start
# leer, bis die naechste Aktualisierung kommt.
persistent=true
userRemovable=true
priority=10
